<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="peakGlow" cx="50%" cy="14%" r="38%">
      <stop offset="0%" stop-color="#5db88a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5db88a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#06091a"/>
  <rect width="1200" height="630" fill="url(#peakGlow)"/>

  <!-- Stars -->
  <circle cx="120" cy="55"  r="1.5" fill="#dedad0" opacity="0.7"/>
  <circle cx="210" cy="30"  r="1.1" fill="#dedad0" opacity="0.55"/>
  <circle cx="335" cy="62"  r="1.3" fill="#dedad0" opacity="0.65"/>
  <circle cx="455" cy="42"  r="0.9" fill="#dedad0" opacity="0.5"/>
  <circle cx="540" cy="22"  r="1.2" fill="#dedad0" opacity="0.6"/>
  <circle cx="660" cy="48"  r="1.0" fill="#dedad0" opacity="0.55"/>
  <circle cx="745" cy="28"  r="1.4" fill="#dedad0" opacity="0.7"/>
  <circle cx="865" cy="60"  r="1.1" fill="#dedad0" opacity="0.6"/>
  <circle cx="980" cy="38"  r="1.3" fill="#dedad0" opacity="0.65"/>
  <circle cx="1065" cy="22" r="1.0" fill="#dedad0" opacity="0.5"/>
  <circle cx="1150" cy="55" r="1.5" fill="#dedad0" opacity="0.7"/>
  <circle cx="180" cy="110" r="1.0" fill="#dedad0" opacity="0.45"/>
  <circle cx="390" cy="95"  r="1.2" fill="#dedad0" opacity="0.5"/>
  <circle cx="820" cy="105" r="1.1" fill="#dedad0" opacity="0.45"/>
  <circle cx="1030" cy="90" r="1.3" fill="#dedad0" opacity="0.5"/>

  <!-- Mountain icon: scale 4×, centered at x=600, peak at y=90 -->
  <!-- translate(400, 50) scale(4) applied to original 100×100 art -->
  <g transform="translate(400,50) scale(4)">
    <!-- Far peak -->
    <polygon points="74,36 96,80 52,80" fill="#1a3a5a"/>
    <!-- Main peak -->
    <polygon points="50,10 84,80 16,80" fill="#5db88a"/>
    <!-- Snow cap -->
    <polygon points="50,10 56,28 44,28" fill="#dedad0" opacity="0.88"/>
    <!-- Horizon line -->
    <line x1="8" y1="82" x2="92" y2="82" stroke="#5db88a" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Branding -->
  <text x="600" y="484" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="58" font-weight="bold" letter-spacing="4"
        fill="#dedad0" opacity="0.92">Equanimity</text>
  <text x="600" y="528" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20" letter-spacing="0.5"
        fill="#8a9eb0" opacity="0.78">Household management for a steady mind</text>
</svg>
